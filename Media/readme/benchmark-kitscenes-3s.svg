<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="664" viewBox="0 0 1000 664" role="img" aria-labelledby="title desc">
  <title id="title">Open-loop error at 3 s on KITScenes-Multimodal validation</title>
  <desc id="desc">ADE and FDE at 3 s in metres, lower is better. Qwen Drive 1.0: ADE 0.565 m, FDE 1.397 m; AutoE2E fine-tuned (kitscenes-epoch-5): ADE 0.744 m, FDE 1.980 m; SimForge: ADE 0.831 m, FDE 2.209 m; AutoE2E (nuplan-epoch-5, zero-shot): ADE 0.915 m, FDE 2.423 m; Alpamayo 1.5: ADE 1.020 m, FDE 2.820 m; VAD: ADE 1.242 m, FDE 2.821 m; METEOR: ADE 1.240 m, FDE 3.282 m; Drive-JEPA: ADE 2.266 m, FDE 4.774 m.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14102a"/><stop offset="0.55" stop-color="#101a2e"/><stop offset="1" stop-color="#0b2430"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a24bf5"/><stop offset="1" stop-color="#5ee0d6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a24bf5"/><stop offset="0.5" stop-color="#f472b6"/><stop offset="1" stop-color="#5ee0d6"/>
    </linearGradient>
