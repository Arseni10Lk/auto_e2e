    <style>
      .num { font-variant-numeric: tabular-nums; }
      .ride { animation: ride 9s infinite both; }
      .fade { animation: ride 9s infinite both, fade 9s infinite both; }
      @keyframes ride {
        0% { transform: translateX(var(--d)); animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
        16%, 89% { transform: translateX(0); animation-timing-function: cubic-bezier(.7, 0, .84, 0); }
        97%, 100% { transform: translateX(var(--d)); }
