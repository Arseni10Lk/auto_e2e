    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a24bf5" stop-opacity="0.26"/><stop offset="0.6" stop-color="#5ee0d6" stop-opacity="0.08"/><stop offset="1" stop-color="#5ee0d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbTeal" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5ee0d6" stop-opacity="0.16"/><stop offset="1" stop-color="#5ee0d6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbPurple" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a24bf5" stop-opacity="0.18"/><stop offset="1" stop-color="#a24bf5" stop-opacity="0"/></radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="664">
