      @keyframes fade { 0% { opacity: 0; } 5%, 90% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .sheen { animation: sheen 3.6s cubic-bezier(.45, 0, .25, 1) infinite; }
      @keyframes sheen { 0% { transform: translateX(0); } 70%, 100% { transform: translateX(380px); } }
      .band { animation: breathe 3.2s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
      .ping { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ping { 0% { transform: scale(1); opacity: .85; } 100% { transform: scale(2.2); opacity: 0; } }
      .shine { animation: sweep 8s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-460px); } 55%, 100% { transform: translateX(1300px); } }
      .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 17s ease-in-out infinite alternate; }
      @keyframes drift1 { to { transform: translate(-70px, 40px); } }
      @keyframes drift2 { to { transform: translate(90px, -50px); } }
