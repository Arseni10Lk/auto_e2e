apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  # IngressClass is CLUSTER-scoped — no namespace field (kubectl would drop it).
  name: console-alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: console-alb-params
---
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  # IngressClassParams is CLUSTER-scoped too (api-resources: NAMESPACED=false).
  name: console-alb-params
spec:
  # Auto Mode's IngressClassParams has no securityGroups field; the ALB SG is
  # attached via the Ingress annotation below.
  scheme: internal
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console-ingress
  namespace: console
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    # HTTP:80 only. CloudFront terminates viewer TLS and reaches this internal
    # ALB over an http-only VPC origin, so the ALB has no ACM cert.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Console frontend SG (substituted by apply.sh). It admits :80 only from
    # CloudFront's managed VPC-origin ENIs. Auto Mode sets custom frontend SGs
    # here, not in IngressClassParams.
    alb.ingress.kubernetes.io/security-groups: ${CONSOLE_ALB_SG_ID}
    # Custom security-groups disable auto-managed ALB->pod rules. Without this
    # flag targets register but every request is dropped at the pod SG.
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    # Health checks are configured per-Service in services.yaml.
spec:
  ingressClassName: console-alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: console-api
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: console-api
                port:
                  number: 8080
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: console-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console-web
                port:
                  number: 3000
