apiVersion: v1
kind: Service
metadata:
  name: console-api
  namespace: console
  labels:
    app: console-api
  annotations:
    # Health checks are per-Service: an Ingress-level healthcheck-path would
    # also probe console-web at /readyz (404) and deregister the UI targets.
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app: console-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: console-web
  namespace: console
  labels:
    app: console-web
  annotations:
    # The Next.js app has no /readyz route.
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app: console-web
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
