# Defense-in-depth for the in-cluster path; the ALB SG (CloudFront VPC-origin
# ENIs only) is the primary control.
#
# Under the AWS VPC CNI pod IPs come from the VPC CIDR, so a whole-VPC ipBlock
# would admit every pod. Ingress is scoped to the internal-elb subnet CIDRs
# where the ALB ENIs live (substituted by apply.sh). Together with the
# web-only podSelector this keeps other cluster pods (e.g. Flyte training
# jobs) from reaching console-api and pulling presigned S3 URLs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-api-ingress
  namespace: console
spec:
  podSelector:
    matchLabels:
      app: console-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The web frontend (server components / same-origin proxy).
        - podSelector:
            matchLabels:
              app: console-web
        # Internal ALB ENIs (target-type: ip). The ALB may place an ENI in
        # any of the three per-AZ internal-elb subnets.
        - ipBlock:
            cidr: ${ALB_SUBNET_CIDR_A}
        - ipBlock:
            cidr: ${ALB_SUBNET_CIDR_B}
        - ipBlock:
            cidr: ${ALB_SUBNET_CIDR_C}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-web-ingress
  namespace: console
spec:
  podSelector:
    matchLabels:
      app: console-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: ${ALB_SUBNET_CIDR_A}
        - ipBlock:
            cidr: ${ALB_SUBNET_CIDR_B}
        - ipBlock:
            cidr: ${ALB_SUBNET_CIDR_C}
      ports:
        - protocol: TCP
          port: 3000
