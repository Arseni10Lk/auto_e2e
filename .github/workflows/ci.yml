name: CI

on:
  push:
  pull_request:

# Skip stale in-flight runs when a new push lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Cap hung runs well below the 6h GitHub default.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Keyed on requirements.txt so torch (~1GB) is only re-downloaded
          # when the pins change.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: make setup

      # `if: always()` on the later steps reports failures from every check,
      # not just the first one that fails.
      - name: Lint with ruff
        run: make lint

      - name: Type-check with mypy
        if: always()
        run: make typecheck

      - name: Run unit tests
        if: always()
        run: make test
